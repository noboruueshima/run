name: Garmin export

on:
  schedule:
    - cron: "0 23 * * *"   # 毎日 08:00 JST（UTC 23:00）
  workflow_dispatch:        # 手動実行ボタン

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch activities
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          TZ: Asia/Tokyo
        run: python fetch_activities.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/activities.csv
          git diff --cached --quiet || git commit -m "Update activities $(date +%F)"
          git push
