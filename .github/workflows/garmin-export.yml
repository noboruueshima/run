name: Garmin export

on:
  schedule:
    - cron: "0 23 * * *"   # 毎日 08:00 JST（UTC 23:00）
  workflow_dispatch:        # 手動実行ボタン
    inputs:
      fetch_days:
        description: "何日分さかのぼるか（0 = 全期間）"
        default: "14"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch activities
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          TZ: Asia/Tokyo
          FETCH_DAYS: ${{ inputs.fetch_days }}
        run: python fetch_activities.py

      - name: Fetch 1km splits (long runs & races)
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          TZ: Asia/Tokyo
        run: python fetch_splits.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update activities $(date +%F)"
          git push

      - name: Upload CSVs to Google Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_ACTIVITIES_FILE_ID: 1Ql3I-HXg2h8n8Wt3dW1968hroZ4iyuUj
          GDRIVE_SPLITS_FILE_ID: 12A8tFFsN2QxOgfQK_9aYI0ZQEueh4hOD
        run: python upload_to_drive.py
